name: build-release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso grub-pc-bin grub-efi-amd64-bin mtools build-essential python3

      - name: Build
        run: make

      - name: Cari output
        run: ls -la build/ *.iso 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: novaos
          path: |
            build/*.elf
            *.iso

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: Nova OS build ${{ github.run_number }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: |
            *.iso
            build/*.elf
